name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Отменять устаревшие запуски для того же PR/ветки
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Для воспроизводимости лучше зафиксировать, например v2.9.0
          version: latest

      - name: Test
        run: go test -race ./...